name: cross-platform-cmd-statusline-install

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          NODE_ENV: development
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Unit tests + coverage
        run: npm run test:unit
      - name: Install Command Code CLI (needed by sync scripts)
        run: npm install -g command-code
      - name: Install Playwright browsers (headless shell only)
        run: npx playwright install --with-deps --only-shell chromium
      - name: E2E tests
        run: npm run test:e2e

  cross-platform:
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Command Code CLI
        run: npm install -g command-code --no-audit --no-fund
      - name: Verify CLI
        run: cmd --version
      - name: Install the mod (user scope)
        run: cmd mods add ${{ github.repository }} -g
      - name: Verify mod loads with no warnings
        run: cmd mods list
      - name: Smoke-load the mod file directly
        run: cmd --mod ./index.ts --version

  # Single aggregate status so branch protection can require one check instead
  # of four flat rows. Matrix legs still show their individual results, but the
  # PR sees a single "ci" status.
  ci:
    needs: cross-platform
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all upstream jobs passed
        run: |
          if [ "${{ needs.quality.result }}" = "success" ] && [ "${{ needs.cross-platform.result }}" = "success" ]; then
            echo "All jobs passed"
            exit 0
          else
            echo "One or more jobs failed"
            exit 1
          fi
