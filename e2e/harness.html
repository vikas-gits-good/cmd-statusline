<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cmd-statusline harness</title>
</head>
<body>
<div id="status"></div>
<script type="module">
// Harness renders the status line as semantic DOM with data-testid, so
// Playwright selectors target stable segments instead of raw ANSI strings.
import {buildStatusLine, computeStatus, resolveContextWindow, CONTEXT_WINDOWS, PLAN_CREDITS} from '/e2e/lib.browser.js';

function renderStatus(scenario) {
	// Scenario keys are human intent: usg/wkl/tot are target percentages,
	// remaining is the dollar figure for crdt. Derive raw usage fields so
	// the real pct/cyclePct math produces exactly those numbers.
	const hasUsage = scenario.hasUsage !== false;
	const usg = scenario.usg ?? 0;
	const wkl = scenario.wkl ?? 0;
	const tot = scenario.tot ?? 0;
	const remaining = scenario.remaining ?? 0;
	const planId = scenario.planId ?? 'individual-pro';

	// cyclePct denominator = max(planCredits, monthlyCredits) + purchased + free.
	const planCredits = PLAN_CREDITS[planId] ?? remaining;
	const pool = Math.max(planCredits, remaining);

	const state = {
		cwd: scenario.cwd ?? 'repo',
		branch: scenario.branch ?? 'main',
		dirty: scenario.dirty ?? false,
		sessionName: scenario.sessionName ?? '',
		model: scenario.model ?? 'deepseek/deepseek-v4-pro',
		effort: scenario.effort ?? 'high',
		currentTokens: scenario.currentTokens ?? 0,
		contextLimit: scenario.contextLimit ?? 1_000_000,
		usage: hasUsage
			? {
				planId,
				fiveHourUsed: usg,
				fiveHourCap: 100,
				weeklyUsed: wkl,
				weeklyCap: 100,
				monthlyCredits: remaining,
				purchasedCredits: 0,
				freeCredits: 0,
				// totalSpent such that totalSpent/pool = tot/100 exactly.
				totalSpent: (tot / 100) * pool,
			}
			: null,
	};

	const full = buildStatusLine(state);
	const seg = computeStatus(state);
	const root = document.getElementById('status');
	root.innerHTML = '';

	const entries = [
		['cwd', seg.cwd],
		['branch', seg.branch],
		['dirty', seg.dirty],
		['session-name', seg.sessionName],
		['model', seg.model],
		['effort', seg.effort],
		['cntx', seg.cntx === null ? '--' : String(seg.cntx)],
	];
	if (seg.usge !== null) entries.push(['usge', String(seg.usge)]);
	if (seg.wkly !== null) entries.push(['wkly', String(seg.wkly)]);
	if (seg.totl !== null) entries.push(['totl', String(seg.totl)]);
	if (seg.crdt !== null) entries.push(['crdt', seg.crdt]);

	for (const [id, value] of entries) {
		const span = document.createElement('span');
		span.setAttribute('data-testid', id);
		span.textContent = value;
		root.appendChild(span);
		if (id !== entries[entries.length - 1][0]) {
			root.appendChild(document.createTextNode(' '));
		}
	}

	window.__lastRawStatusLine = full;
	return full;
}

window.renderStatus = renderStatus;
window.resolveContextWindow = resolveContextWindow;
window.CONTEXT_WINDOWS = CONTEXT_WINDOWS;
</script>
</body>
</html>
